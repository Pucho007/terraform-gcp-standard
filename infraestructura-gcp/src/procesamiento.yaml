main:
  params: [event]
  steps:
    - variables_iniciales:
        assign:
          # Nativas de Workflows (Doble Dólar)
          - nombre_archivo: '$${event.data.name}'
          - nombre_bucket: '$${event.data.bucket}'
          - project_id: '$${sys.get_env("GOOGLE_CLOUD_PROJECT_ID")}'
          - ruta_archivo_gs: '$${"gs://" + nombre_bucket + "/" + nombre_archivo}'
          
          # Inyectadas por Terraform (Un solo Dólar)
          - dataset_id: '${mi_dataset_inyectado}'
          - table_id: '${mi_tabla_inyectada}'
          - dataform_region: '${mi_region}'
          - dataform_repo: '${mi_repo_dataform}'

    - cargar_datos_a_bigquery:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: $${project_id}
          body:
            configuration:
              load:
                sourceUris: ['$${ruta_archivo_gs}']
                destinationTable:
                  projectId: $${project_id}
                  datasetId: $${dataset_id}
                  tableId: $${table_id}
                # sourceFormat: "NEWLINE_DELIMITED_JSON" #
                sourceFormat: "CSV" # 
                autodetect: true
                writeDisposition: "WRITE_APPEND"
          
    # DATAFORM
    - gatillar_dataform:
        call: http.post
        args:
          url: $${"https://dataform.googleapis.com/v1beta1/projects/" + project_id + "/locations/" + dataform_region + "/repositories/" + dataform_repo + "/workflowInvocations"}
          auth:
            type: OAuth2
          body:
            invocationConfig:
              includedTargets: []
        result: respuesta_dataform

    - fin_exitoso:
        return: 
          estado: "Completado"
          dataform: $${respuesta_dataform.body}